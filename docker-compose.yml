services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: provmon
      POSTGRES_PASSWORD: provmon
      POSTGRES_DB: provmon
    ports:
      # Loopback only: the database is for local tooling, not the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provmon -d provmon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    # Require authentication and re-enable protected mode. The app and worker
    # authenticate via REDIS_URL; unauthenticated clients are rejected.
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}",
        "--protected-mode",
        "yes",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      # Loopback only: containers use the internal network, not this mapping.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: docker.io/axllent/mailpit:latest
    restart: unless-stopped
    ports:
      # Loopback only: local email testing, never exposed to the LAN.
      - "127.0.0.1:1025:1025" # SMTP for local email delivery testing
      - "127.0.0.1:8025:8025" # Web UI

volumes:
  postgres-data:
  redis-data:
